name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted:6bb7483fece0
    steps:
      - name: Pull the code
        uses: actions/checkout@v4

      - name: Build and deploy the image
        run: docker compose up -d

      - name: Clean up old images
        run: docker image prune -f
